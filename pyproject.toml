[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymathica-hackathon"
version = "1.0.0"
description = "Judge-facing POLYMATHICA hackathon workflow demonstration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kevin Smith"}]

[project.scripts]
polymathica-demo = "polymathica_hackathon.cli:main"
polymathica-benchmark = "polymathica_hackathon.benchmark:main"
polymathica-projection = "polymathica_hackathon.projection:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
