name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run demo workflow
        run: python -m polymathica_hackathon.cli --output demo/output
      - name: Run benchmark solver
        run: python -m polymathica_hackathon.benchmark --output demo/benchmark
      - name: Run projection benchmark
        run: python -m polymathica_hackathon.projection --output demo/projection
      - name: Run Poiseuille benchmark
        run: python -m polymathica_hackathon.poiseuille --output demo/poiseuille
      - name: Run tests
        run: python -m unittest discover -s tests
